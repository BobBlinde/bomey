services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DBUser:?set DBUser in .env}
      POSTGRES_PASSWORD: ${DBPassword:?set DBPassword in .env}
      POSTGRES_DB: ${DBName:-bomey}
    ports:
      - "127.0.0.1:${DBPort:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
